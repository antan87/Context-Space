name: Release

# One deliberate, coordinated release for every channel (npm + VS Code extension
# + desktop installer), dispatched against protected default-branch workflow code:
#
#   npm version minor --no-git-tag-version  # bump + sync in a reviewed PR
#   gh api repos/OWNER/REPO/dispatches \
#     -f event_type=release -F client_payload[version]=X.Y.Z \
#     -F client_payload[expected_sha]=<verified commit SHA>
#
# The repository_dispatch event always loads this workflow from the default
# branch; workflow_dispatch is rejected unless it targets the default branch. The
# guard validates the requested version, requires every check in
# .github/release-required-checks.json to have succeeded on this exact source SHA
# (fail closed), and only then creates the tag. Jobs that hold publish credentials
# run in the protected `release` environment. See RELEASING.md "Publish gate".
#
# Prerelease versions (e.g. 1.2.0-rc.1) publish npm under the "next" dist-tag, mark
# the GitHub Release as a prerelease, and skip the Marketplace (which does not
# support semver prerelease suffixes).

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match package.json, e.g. 2.12.1)'
        required: true
        type: string
      expected_sha:
        description: 'Optional: the full commit SHA you verified. The release fails if the default branch has moved past it.'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Gate: protected source, requested version, and synced files must agree ──
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    permissions:
      contents: write   # creates the immutable release tag
      checks: read      # reads required check results for the exact source SHA
    steps:
      # The owner's brake. While the repository variable RELEASES_PAUSED is set, nothing
      # publishes, whoever dispatched the run. It uses the same values as
      # `npm run release:ship`, so the two cannot disagree about whether releases are paused.
      - name: Refuse while releases are paused
        env:
          RELEASES_PAUSED: ${{ vars.RELEASES_PAUSED }}
        run: |
          value="${RELEASES_PAUSED,,}"
          value="${value//[[:space:]]/}"
          case "$value" in
            1|true|yes|on)
              echo "::error::Releases are paused (the RELEASES_PAUSED repository variable is set). Nothing was published. Clear the variable to release."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          # The release guard must prove the dispatched source belongs to the
          # protected default-branch history before any irreversible publish.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # workflow_dispatch loads this file from whichever ref was selected; only the
      # default branch may release. The `release` environment's branch policy is
      # the enforcing control for credentials; this makes a wrong ref fail early.
      - name: Require dispatch from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release-guard.mjs ref --ref "$GITHUB_REF" --default-branch "$DEFAULT_BRANCH"

      - name: Require dispatched source on protected default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Dispatched source $GITHUB_SHA is not on origin/$DEFAULT_BRANCH. Merge through protected CI before releasing."
            exit 1
          fi
          echo "Dispatched source is on protected origin/$DEFAULT_BRANCH history."

      - name: Resolve and validate version
        id: resolve
        env:
          REQUESTED: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          echo "Requested version: $REQUESTED / package.json version: $PKG"
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" != "$PKG" ]; then
            echo "::error::Requested version ($REQUESTED) does not match package.json version ($PKG). Merge a synchronized version bump first."
            exit 1
          fi
          node scripts/sync-version.mjs --check
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=v$PKG" >> "$GITHUB_OUTPUT"
          if [[ "$PKG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Dispatch always loads the tip of the default branch. When the dispatcher
      # pinned the commit it verified (client_payload.expected_sha or the
      # expected_sha input), refuse to release anything else.
      - name: Require the pinned source commit, when one was given
        env:
          EXPECTED_SHA: ${{ github.event.client_payload.expected_sha || inputs.expected_sha }}
        run: node scripts/release-guard.mjs pin --expected "$EXPECTED_SHA" --actual "$GITHUB_SHA"

      # Several agents can prepare releases at once. A stale version must not
      # publish after a newer one, which would move npm's `latest` backwards.
      - name: Require a version that moves forward from every release tag
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git ls-remote --tags --refs origin > "$RUNNER_TEMP/release-tags.txt"
          node scripts/release-guard.mjs version --version "$VERSION" --tags-file "$RUNNER_TEMP/release-tags.txt"

      - name: Require successful checks for the exact source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-guard.mjs checks --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"

      - name: Create immutable release tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          REMOTE_SHA=$(git ls-remote --refs origin "refs/tags/$TAG" | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists at $REMOTE_SHA, expected $GITHUB_SHA. Refusing to move it."
              exit 1
            fi
            echo "Tag $TAG already exists at the protected source SHA; continuing idempotently."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  # ── npm ──────────────────────────────────────────────────────────────────────
  # npm package publishing is optional / deprecated in favor of GitHub Releases.
  # To enable npm publishing: set the repository variable NPM_PUBLISHING_ENABLED=true.
  # An npm publish failure does not block the other channels.
  npm:
    needs: guard
    if: vars.NPM_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      status: ${{ steps.npm-status.outputs.status }}
    permissions:
      id-token: write   # npm trusted publishing and provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      # Trusted publishing requires npm 11.5.1+ and Node 22.14.0+.
      - run: npm install --global npm@11.5.1

      - run: npm ci
      - run: npm ci --prefix gui
      - run: npm run build

      - name: Publish to npm
        id: npm-publish
        continue-on-error: true
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          if npm info "@mrpatronz/nexusflow@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION — skipping (idempotent re-run)."
            echo "status=already published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Record npm channel status
        id: npm-status
        if: always()
        env:
          PUBLISH: ${{ steps.npm-publish.outcome }}
          RESULT: ${{ steps.npm-publish.outputs.status }}
        run: |
          if [ "$PUBLISH" != "success" ]; then
            status="failed"
            echo "::warning::npm publish failed; the other channels continue."
          else
            status="${RESULT:-published}"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

  # ── VS Code Marketplace ───────────────────────────────────────────────────────
  # Stable releases always include a VSIX. Marketplace publishing alone is gated
  # behind a repo variable until Azure OIDC is configured.
  # To re-enable: set the repo/environment variable VSCODE_PUBLISHING_ENABLED=true.
  # A Marketplace failure does not block the other channels; it is recorded as a
  # failed channel and turns the release run red after the GitHub Release exists.
  vscode:
    needs: guard
    if: needs.guard.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: release
    outputs:
      marketplace: ${{ steps.marketplace-status.outputs.status }}
    permissions:
      id-token: write   # Azure OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --prefix extension

      - name: Package installable VSIX
        working-directory: extension
        run: npx vsce package --no-dependencies --out ../ContextSpace.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextspace-vscode
          path: ContextSpace.vsix
          if-no-files-found: error

      - name: Azure Login (OIDC — no stored PAT)
        if: vars.VSCODE_PUBLISHING_ENABLED == 'true'
        id: azure-login
        continue-on-error: true
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        id: marketplace-publish
        if: steps.azure-login.outcome == 'success'
        continue-on-error: true
        working-directory: extension
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          PUBLISHED=$(npx vsce show contextspace.contextspace-vscode --json 2>/dev/null \
            | node -e "
                const d=require('fs').readFileSync(0,'utf8');
                try { process.exit(JSON.parse(d).versions?.['$VERSION'] ? 0 : 1); }
                catch { process.exit(1); }
              " && echo "true" || echo "false")
          if [ "$PUBLISHED" = "true" ]; then
            echo "Marketplace already has $VERSION — skipping (idempotent re-run)."
            echo "status=already published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx vsce publish --no-dependencies --azure-credential
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Record Marketplace channel status
        id: marketplace-status
        if: always()
        env:
          ENABLED: ${{ vars.VSCODE_PUBLISHING_ENABLED }}
          LOGIN: ${{ steps.azure-login.outcome }}
          PUBLISH: ${{ steps.marketplace-publish.outcome }}
          RESULT: ${{ steps.marketplace-publish.outputs.status }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            status="disabled"
          elif [ "$LOGIN" != "success" ]; then
            status="failed"
            echo "::error::Azure OIDC login failed or is not configured; the VS Code Marketplace was not updated."
          elif [ "$PUBLISH" != "success" ]; then
            status="failed"
            echo "::error::VS Code Marketplace publish failed; the other channels continue."
          else
            status="${RESULT:-published}"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

  # ── Desktop installers (Windows NSIS + Linux AppImage) ────────────────────────
  desktop:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm ci --prefix gui
      - run: npm ci --prefix desktop
      - run: npm run setup --prefix desktop

      # electron-builder builds the native installer and update metadata. The
      # package script uses --publish never; the GitHub Release job attaches the
      # generated files after both platform jobs complete.
      - name: Build desktop installer and update metadata
        run: npm run build --prefix desktop

      - name: Verify exact desktop artifact and updater metadata
        run: node desktop/scripts/verify-release-assets.mjs --platform ${{ matrix.platform }} --dir desktop/dist

      - name: Stage Windows desktop artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          if (Test-Path desktop/dist/ContextSpaceSetup.exe) {
            Copy-Item desktop/dist/ContextSpaceSetup.exe release-assets/ContextSpaceSetup.exe
          } else {
            Copy-Item desktop/dist/NexusFlowSetup.exe release-assets/NexusFlowSetup.exe
          }
          Copy-Item desktop/dist/latest.yml release-assets/latest.yml
          Get-ChildItem desktop/dist -File -Filter '*.blockmap' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName release-assets }

      - name: Stage Linux desktop artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find desktop/dist -maxdepth 1 -type f -name '*.AppImage' -exec cp {} release-assets/ \;
          cp desktop/dist/latest-linux.yml release-assets/latest-linux.yml

      - name: Generate installer SHA-256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem release-assets -File -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Generate installer SHA-256 checksum (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in release-assets/*.AppImage; do
            sha256sum "$artifact" | sed 's#  release-assets/#  #' > "$artifact.sha256"
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextspace-desktop-${{ matrix.platform }}
          path: |
            release-assets/*
          if-no-files-found: error

  # ── One GitHub Release for the tag, with every artifact attached ───────────────
  github-release:
    needs: [guard, npm, vscode, desktop]
    # Run even if npm was skipped or failed, and even if the Marketplace job was skipped (prereleases).
    if: always() && needs.guard.result == 'success' && needs.desktop.result == 'success' && (needs.vscode.result == 'success' || needs.vscode.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: contextspace-desktop-*
          merge-multiple: true
          path: dist

      - name: Download VSIX artifact
        if: needs.vscode.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: contextspace-vscode
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: Release v${{ needs.guard.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.guard.outputs.prerelease == 'true' }}
          files: |
            dist/*

      # Every channel is listed so a skipped or failed one cannot go unnoticed.
      # A failed Marketplace publish turns the run red after the other channels
      # shipped; re-running the whole workflow is idempotent for them.
      - name: Report channel status
        id: channel-status
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          SHA: ${{ needs.guard.outputs.sha }}
          NPM_JOB: ${{ needs.npm.result }}
          NPM: ${{ needs.npm.outputs.status }}
          VSCODE_JOB: ${{ needs.vscode.result }}
          MARKETPLACE: ${{ needs.vscode.outputs.marketplace }}
        run: |
          if [ "$VSCODE_JOB" = "skipped" ]; then
            vsix="not built (prerelease)"; marketplace="skipped (prerelease)"
          else
            vsix="attached"; marketplace="${MARKETPLACE:-unknown}"
          fi
          if [ "$NPM_JOB" = "skipped" ]; then
            npm_status="disabled"
          elif [ "$NPM_JOB" = "failure" ] || [ "$NPM" = "failed" ]; then
            npm_status="failed"
          elif [ "$NPM_JOB" = "cancelled" ]; then
            npm_status="cancelled"
          elif [ "$NPM_JOB" = "success" ]; then
            npm_status="${NPM:-published}"
          else
            npm_status="disabled"
          fi
          {
            echo "### Release $TAG from \`$SHA\`"
            echo ""
            echo "| Channel | Status |"
            echo "| --- | --- |"
            echo "| npm | $npm_status |"
            echo "| Desktop installers | attached |"
            echo "| VSIX | $vsix |"
            echo "| VS Code Marketplace | $marketplace |"
            echo "| GitHub Release | published |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$marketplace" = "failed" ] || [ "$marketplace" = "unknown" ]; then
            echo "::error::VS Code Marketplace channel status is $marketplace for $TAG. Other channels shipped; re-run the workflow after fixing Marketplace credentials."
            exit 1
          fi
