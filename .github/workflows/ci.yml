name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.13.0, 24]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check version consistency
        run: node scripts/sync-version.mjs --check

      - name: Install Dependencies
        run: npm ci

      - name: Install GUI Dependencies
        run: npm ci --prefix gui

      - name: Install Extension Dependencies
        run: npm ci --prefix extension

      - name: Build Project
        run: npm run build

      - name: Lint GUI
        run: npm run lint --prefix gui

      - name: Check for dynamic any types
        run: node scripts/check-no-any.mjs

      - name: Verify native terminal with the backend runtime
        run: node dist/terminal/smoke.js

      - name: Validate development skills and documented commands
        run: npm run check:skills

      - name: Compile VS Code Extension
        run: npm run extension:compile

      - name: Verify VS Code release package
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.13.0'
        working-directory: extension
        run: npx vsce package --no-dependencies --out "${{ runner.temp }}/contextspace-ci.vsix"

      - name: Run Tests
        run: npm test

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        working-directory: gui

      - name: Run GUI E2E Tests
        run: npm run test:gui

      - name: Run real terminal GUI E2E
        working-directory: gui
        run: npx playwright test --config playwright.terminal.config.ts

  desktop-macos-terminal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix gui
      - run: npm ci --prefix desktop
      # afterPack launches a real PTY with the packaged Electron runtime.
      - run: npm run pack --prefix desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # Verify both first-class desktop targets package into a standalone build and
  # their PACKAGED binaries boot the bundled backend (the app.isPackaged path
  # that can't be exercised in dev).
  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            packaged_exe: dist/win-unpacked/ContextSpace.exe
          - os: ubuntu-latest
            platform: linux
            packaged_exe: dist/linux-unpacked/contextspace-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Windows upgrade script syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'desktop/scripts/verify-windows-upgrade.ps1'),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install GUI Dependencies
        run: npm ci --prefix gui

      - name: Install Desktop Dependencies
        run: npm ci --prefix desktop

      - name: Download Electron runtime for source/E2E desktop launch
        run: npm run setup --prefix desktop

      # `npm run build --prefix desktop` runs prepare-backend (builds the CLI +
      # gui, stages dist/ and prod deps into desktop/backend) then packages the
      # native installer; it also leaves the unpacked app for the boot test.
      - name: Package desktop app (installer + unpacked + update metadata)
        run: npm run build --prefix desktop

      - name: Verify exact desktop artifact and updater metadata
        run: node desktop/scripts/verify-release-assets.mjs --platform ${{ matrix.platform }} --dir desktop/dist

      - name: Set packaged Linux AppImage for updater IPC test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find "$GITHUB_WORKSPACE/desktop/dist" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage" && test -f "$appimage"
          test "${appimage:0:1}" = "/"
          echo "APPIMAGE=$appimage" >> "$GITHUB_ENV"

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Verify installed Windows upgrade from 2.9.0
        if: runner.os == 'Windows'
        timeout-minutes: 25
        shell: pwsh
        run: ./desktop/scripts/verify-windows-upgrade.ps1

      - name: Run packaged-app E2E (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        env:
          CONTEXTSPACE_PACKAGED_EXE: ${{ matrix.packaged_exe }}
          NEXUSFLOW_PACKAGED_EXE: ${{ matrix.packaged_exe }}
        run: npm run test:e2e

      - name: Run packaged-app E2E (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        env:
          CONTEXTSPACE_PACKAGED_EXE: ${{ matrix.packaged_exe }}
          NEXUSFLOW_PACKAGED_EXE: ${{ matrix.packaged_exe }}
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Smoke launch the actual Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$APPIMAGE"
          test -x "$appimage" || chmod +x "$appimage"
          set +e
          timeout --kill-after=10s 180s xvfb-run --auto-servernum env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" >/tmp/contextspace-appimage-smoke.log 2>&1
          code=$?
          set -e
          # The desktop app is expected to stay open; timeout is the success
          # signal. Require the backend's explicit ready marker as proof that
          # the actual AppImage booted, rather than accepting any long-running
          # process or the separate unpacked-app E2E above.
          grep -Eq '(CONTEXTSPACE|NEXUSFLOW)_READY_PORT=[0-9]+' /tmp/contextspace-appimage-smoke.log
          test "$code" -eq 124 -o "$code" -eq 137

      - name: Stage Windows desktop artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/release-assets | Out-Null
          if (Test-Path desktop/dist/ContextSpaceSetup.exe) {
            Copy-Item desktop/dist/ContextSpaceSetup.exe desktop/release-assets/ContextSpaceSetup.exe
          } else {
            Copy-Item desktop/dist/NexusFlowSetup.exe desktop/release-assets/NexusFlowSetup.exe
          }
          Copy-Item desktop/dist/latest.yml desktop/release-assets/latest.yml
          Get-ChildItem desktop/dist -File -Filter '*.blockmap' -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName desktop/release-assets }

      - name: Stage Linux desktop artifacts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop/release-assets
          find desktop/dist -maxdepth 1 -type f -name '*.AppImage' -exec cp {} desktop/release-assets/ \;
          cp desktop/dist/latest-linux.yml desktop/release-assets/latest-linux.yml

      - name: Generate desktop artifact checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem desktop/release-assets -File -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Generate desktop artifact checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for artifact in desktop/release-assets/*.AppImage; do
            sha256sum "$artifact" | sed "s#  desktop/release-assets/#  #" > "$artifact.sha256"
          done

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: contextspace-desktop-${{ matrix.platform }}
          path: desktop/release-assets/*
          if-no-files-found: error
